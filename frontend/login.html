<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StreakMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 440px;">
            <div class="auth-header">
                <h1>StreakMate</h1>
                <p>Build consistency and track your daily progress</p>
            </div>

            <div class="auth-body">
                <div class="brand-note">
                    <h2>Welcome Back</h2>
                    <p>Log in to manage your habits and daily streaks.</p>
                </div>

                <div id="messageBox" class="alert d-none" role="alert" aria-live="polite"></div>

                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Enter your username" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-main w-100">Login</button>
                </form>

                <div class="bottom-link">
                    Don’t have an account?
                    <a href="register.html">Create one here</a>
                </div>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="login.js"></script>
</body>
</html>
