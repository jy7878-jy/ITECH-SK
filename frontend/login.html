<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StreakMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fbff 0%, #eef4ff 100%);
        }

        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 18px 45px rgba(13, 110, 253, 0.10);
            background: #fff;
        }

        .auth-header {
            background: linear-gradient(135deg, #0d6efd 0%, #3d8bfd 100%);
            color: white;
            padding: 28px 24px 22px;
            text-align: center;
        }

        .auth-header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
        }

        .auth-header p {
            margin: 10px 0 0;
            opacity: 0.9;
            font-size: 0.98rem;
        }

        .auth-body {
            padding: 28px 24px;
        }

        .brand-note {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-note h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .brand-note p {
            margin: 0;
            color: #6c757d;
        }

        .form-label {
            font-weight: 600;
            color: #212529;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 14px;
        }

        .btn-main {
            border-radius: 12px;
            padding: 12px;
            font-weight: 700;
        }

        .bottom-link {
            text-align: center;
            margin-top: 18px;
            color: #6c757d;
        }

        .bottom-link a {
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h1>StreakMate</h1>
                <p>Build consistency and track your daily progress</p>
            </div>

            <div class="auth-body">
                <div class="brand-note">
                    <h2>Welcome Back</h2>
                    <p>Log in to manage your habits and daily streaks.</p>
                </div>

                <div id="messageBox" class="alert d-none" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input
                            type="text"
                            id="username"
                            class="form-control"
                            placeholder="Enter your username"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-main w-100">
                        Login
                    </button>
                </form>

                <div class="bottom-link">
                    Don’t have an account?
                    <a href="register.html">Create one here</a>
                </div>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
